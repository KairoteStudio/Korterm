name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Check, test, clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (X11/Wayland linking)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-cursor-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked

      - name: cargo test (vendored crates)
        # `cargo test` skips path dependencies, so the terminal crate's
        # tests (selection anchoring, cursor visibility, …) would never
        # run in CI without this.
        run: cargo test --locked -p terminal

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
