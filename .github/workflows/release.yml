name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Required for softprops/action-gh-release to upload artifacts (the
# default GITHUB_TOKEN is read-only without this).
permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (X11/Wayland linking)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-cursor-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked --release

      - name: cargo test (vendored crates)
        run: cargo test --locked --release -p terminal

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml version ${PKG_VERSION}"
            echo "Bump version in Cargo.toml before tagging — otherwise the .deb"
            echo "keeps the old version and apt refuses to upgrade it."
            exit 1
          fi

      - name: Build optimized binary
        run: cargo build --release --locked

      - name: Pack tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          install -Dm755 target/release/korterm "korterm-${VERSION}/korterm"
          cp -r assets "korterm-${VERSION}/assets"
          cp README.md LICENSE install.sh "korterm-${VERSION}/"
          tar czf "korterm-${VERSION}-x86_64-linux.tar.gz" "korterm-${VERSION}"

      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
          VERSION="${GITHUB_REF_NAME}"
          mv target/debian/*.deb "korterm-${VERSION}-x86_64-linux.deb"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            korterm-*-x86_64-linux.tar.gz
            korterm-*-x86_64-linux.deb
          generate_release_notes: true
