     file, You can obtain one at https://mozilla.org/MPL/2.0/. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171d"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <!-- Soft radial glows (Fleet blue / amber), fading to transparent —
         the same look as the app's radial-glow background. -->
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a8cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4a8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c99a5b" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#c99a5b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="island">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <!-- island background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- corner glows, clipped to the island -->
  <g clip-path="url(#island)">
    <circle cx="90" cy="70" r="210" fill="url(#glowBlue)"/>
    <circle cx="450" cy="460" r="190" fill="url(#glowAmber)"/>
  </g>

  <!-- ring -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none"
        stroke="#ffffff" stroke-opacity="0.09" stroke-width="5"/>

  <!-- prompt chevron > -->
  <path d="M150 172 L236 256 L150 340" fill="none" stroke="#4a8cff"
        stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- underscore _ -->
  <rect x="282" y="316" width="104" height="42" rx="21" fill="#cfd1d4"/>
</svg>
