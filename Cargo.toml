[package]
name = "korterm"
version = "1.0.0"
description = "Korterm - Standalone Terminal Application"
edition = "2021"
license = "MPL-2.0"
categories = ["command-line-utilities", "gui"]
keywords = ["terminal", "emulator", "iced", "gui"]

[[bin]]
name = "korterm"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["wgpu", "svg", "image", "advanced", "canvas", "tokio"] }
iced_winit = "0.14"
terminal = { path = "crates/terminal" }
dirs = "5"
tokio = { version = "1", features = ["time"] }
vector-icons = { path = "crates/vector-icons" }

# Debian package: `cargo install cargo-deb && cargo deb`
# (asset paths point at the flat files generated from assets/icon.svg)
[package.metadata.deb]
maintainer = "Korterm Developers <korterm@localhost>"
copyright = "2025, Korterm Developers"
license-file = ["LICENSE", "0"]
extended-description = """\
Korterm is a standalone, Fleet-style terminal emulator built with iced. \
It ships a custom titlebar with drag-reorder tabs (horizontal or sidebar), \
a Quake-style quick terminal toggleable from a global system shortcut, \
a full settings panel (appearance, glow colors, keybindings) persisted to \
~/.config/korterm/config.conf, IME-aware input, search, and Ctrl+click \
jump-to-file/URL. Terminal emulation and PTY handling come from the \
sibling Kortina.ICED `terminal` crate. Linux (X11/XWayland) only."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/korterm", "usr/bin/", "755"],
    ["assets/korterm.desktop", "usr/share/applications/", "644"],
    ["assets/icon-16.png", "usr/share/icons/hicolor/16x16/apps/korterm.png", "644"],
    ["assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/korterm.png", "644"],
    ["assets/icon-48.png", "usr/share/icons/hicolor/48x48/apps/korterm.png", "644"],
    ["assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/korterm.png", "644"],
    ["assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/korterm.png", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/korterm.png", "644"],
    ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/korterm.png", "644"],
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
